<!DOCTYPE html>
<html>
<head>
    <style>
        body { background: #000; color: #0f0; font-family: monospace; display: flex; flex-direction: column; align-items: center; }
        .category-row { margin: 10px; }
        button { background: #222; color: #0f0; border: 1px solid #0f0; padding: 10px; margin: 5px; cursor: pointer; }
        button:hover { background: #0f0; color: #000; }
    </style>
</head>
<body>

    <h2>COREX//SYNC</h2>

    <!-- Example: Swimwear Category -->
    <div class="category-row">
        <h3>Swimwear</h3>
        <button onclick="sendCommand('Swimwear', '1')">Style 1</button>
        <button onclick="sendCommand('Swimwear', '2')">Style 2</button>
        <button onclick="sendCommand('Swimwear', '3')">Style 3</button>
    </div>

    <!-- System Controls -->
    <div class="category-row">
        <button onclick="sendCommand('StripAll', '0')">STRIP ALL</button>
    </div>

    <script>
        function sendCommand(path, style) {
            // Get the URL hash passed from the LSL script
            const targetUrl = window.location.hash.substring(1);
            if (!targetUrl) {
                console.error("No HUD URL found!");
                return;
            }

            fetch(targetUrl, {
                method: 'POST',
                body: 'data=' + path + ',' + style
            }).then(() => {
                console.log('Sent: ' + path + '/' + style);
            });
        }
    </script>
</body>
</html>
