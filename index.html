<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COREX//SYNC Vanity</title>
    <style>
        :root { 
            --purple-trans: rgba(0, 0, 0, 0.6); 
            --glow: 0 0 10px rgba(255, 238, 219, 0.6); 
            --text-glow: 0 0 10px rgba(255, 238, 219, 0.8);
        }
        body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; color: #cbaf9b; min-height: 100vh; display: flex; justify-content: center; align-items: center; position: relative; background: #000; }
        body::before { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-image: url('closet1.jpg'); background-size: cover; background-position: center; background-attachment: fixed; opacity: 0.5; z-index: -1; }
        .container { width: 63%; max-width: 600px; height: 450px; overflow-y: auto; background: rgba(0, 0, 0, 0.5); padding: 10px; border-radius: 12px; border: 7px solid var(--purple-trans); text-align: center; }
        h1 { font-size: 32px; text-align: center; color: #e0d0c9; letter-spacing: 4px; text-transform: uppercase; margin: 0 0 20px 0; cursor: pointer; font-family: 'Courier New', Courier, monospace; font-weight: 350; text-shadow: var(--text-glow); }
        .status-box { font-size: 12px; color: #ff0000; margin-bottom: 10px; font-family: monospace; }
        .menu-btn, .sub-btn, .nude-btn, .remove-hud-btn { display: block; width: 60%; margin: 0 auto 10px auto; background: rgba(0, 0, 0, 0.6); border: 2px solid rgba(255, 238, 219, 0.4); color: #FFF6ED; padding: 15px 10px; text-transform: uppercase; font-family: 'Courier New', Courier, monospace; font-size: 20px; font-weight: 700; cursor: pointer; border-radius: 6px; opacity: 0.5; }
        .slot-btn { width: 40px; height: 35px; font-size: 20px; font-family: 'Courier New', Courier, monospace; background: rgba(0,0,0,0.4); color: #FFF6ED; border: 2px solid rgba(255, 238, 219, 0.4); cursor: pointer; margin: 3px; }
        .active-glow { border-color: #e0d0c9 !important; box-shadow: var(--glow) !important; opacity: 1 !important; }
        .slot-container, .submenu-items { display: none; padding: 10px; }
        .content { display: none; }
        .controls { display: none; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 30px; }
        .ctrl-btn { background: rgba(0,0,0,0.4); border: 3px solid var(--purple-trans); color: #e0d0c9; padding: 15px; font-size: 17px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h1 onclick="showHome()">𝙲𝙾𝚁𝙴𝚇//𝚂𝚈𝙽𝙲</h1>
        <div id="status" class="status-box">DISCONNECTED</div>
        <button onclick="forceConnect()" style="font-size: 10px; cursor: pointer;">Force Connect (Test Only)</button>

        <div id="home">
            <button class="menu-btn" onclick="showCategory('dresser')">Dresser</button>
            <button class="menu-btn" onclick="showCategory('closet')">Closet</button>
            <button class="menu-btn" onclick="showCategory('wardrobe')">Wardrobe</button>
            <button class="nude-btn" onclick="toggleOnlySlots(this)">Nude</button>
            <div class="slot-container">
                <button class="slot-btn" onclick="send(this,'Nude','style1')">1</button>
                <button class="slot-btn" onclick="send(this,'Nude','style2')">2</button>
                <button class="slot-btn" onclick="send(this,'Nude','style3')">3</button>
            </div>
            <button class="remove-hud-btn" onclick="send(this,'HUD','remove')">Remove HUD</button>
        </div>

        <div id="dresser" class="content"></div>
        <div id="closet" class="content"></div>
        <div id="wardrobe" class="content"></div>

        <div id="controls" class="controls">
            <button class="ctrl-btn" onclick="showHome()">Back</button>
            <button class="ctrl-btn" onclick="send(this,'RemoveLast','detach')">Remove Last Item</button>
        </div>
    </div>

    <script>
        window.onload = function() {
            // Check connection immediately
            checkConnection();
            addCategory('dresser', [["Lounge", "Dresser/Lounge"]]);
            addCategory('closet', [["Skirts", "Closet/Skirts"]]);
            addCategory('wardrobe', [["Casual", "Wardrobe/Casual"]]);
        };

        function checkConnection() {
            var url = window.location.hash.substring(1).trim();
            var status = document.getElementById('status');
            if(url.length > 5) {
                status.innerText = "CONNECTED";
                status.style.color = "#00ff00";
            } else {
                status.innerText = "DISCONNECTED - Waiting for SL link";
                status.style.color = "#ff0000";
            }
        }

        function forceConnect() {
            var url = prompt("Paste your SL object URL here (must start with http):");
            if(url) {
                window.location.hash = url;
                checkConnection();
            }
        }

        function send(btn, part, style) { 
            var url = window.location.hash.substring(1).trim();
            if (!url) {
                alert("STILL DISCONNECTED. Check your LSL script.");
                return;
            }
            var f = document.getElementById('sl_form'); 
            f.action = url; 
            document.getElementById('p_data').value = "cmd=" + part + "," + style; 
            f.submit(); 
        }

        // --- Helper functions ---
        function clearAllGlows() { document.querySelectorAll('button').forEach(b => b.classList.remove('active-glow')); }
        function toggleOnlySlots(btn) { btn.nextElementSibling.style.display = (btn.nextElementSibling.style.display === 'block') ? 'none' : 'block'; btn.classList.add('active-glow'); }
        function showCategory(id) { document.getElementById('home').style.display = 'none'; document.getElementById(id).style.display = 'block'; document.getElementById('controls').style.display = 'grid'; }
        function showHome() { document.getElementById('home').style.display = 'block'; document.querySelectorAll('.content').forEach(c => c.style.display = 'none'); document.getElementById('controls').style.display = 'none'; }
        function addCategory(id, items) { 
            var container = document.getElementById(id);
            items.forEach(item => {
                var btn = document.createElement('button'); btn.className = 'sub-btn'; btn.innerText = item[0];
                btn.onclick = () => toggleOnlySlots(btn);
                var div = document.createElement('div'); div.className = 'slot-container';
                for(var i=1; i<=3; i++) div.innerHTML += `<button class="slot-btn" onclick="send(this,'${item[1]}','style${i}')">${i}</button>`;
                container.appendChild(btn); container.appendChild(div);
            });
        }
    </script>
    <iframe name="secret_frame" style="display:none;"></iframe>
    <form id="sl_form" method="POST" target="secret_frame" style="display:none;"><input type="hidden" id="p_data" name="cmd"></form>
</body>
</html>
